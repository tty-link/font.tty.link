<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>집들이 초대 — 새집에 놀러 와요</title>

  <!-- 폰꾸 런타임: 제목은 세벌식(글꼴을 비움 → data-fonts에는 sebul), 강조 문구는 gothic.
       looks 확장은 변주(kku-vary-*)와 스티커 꾸밈(kku-look-sticker)에 쓴다. -->
  <script src="../lib/font-kku.js" data-fonts="sebul gothic" data-addons="looks"></script>

  <script>
    /* 제목 글꼴 「연필 흘림」 — 세벌·고딕에 거는 칸 계약 세트(frame: "box").
       원형 8칸 ㄱ ㄴ ㅁ ㅅ ㅇ ㆍ ㅡ ㅣ 만 그린다. 나머지 자모(ㅈ ㅂ ㄹ ㅏ ㅔ ㅘ ㅛ …)는
       런타임이 가획·ㅡ·ㅣ 선 조립·천지인(ㅏ = ㅣ + ㆍ)으로 만든다.
       box = 획 중심선이 닿는 범위(칸 좌표 0–100). 런타임이 이 범위를 자모의 표준 자리에 맞춘다.
       느낌: 세로획은 위쪽이 오른쪽으로 5° 남짓 기울고, 가로획은 오른쪽 끝이 살짝 올라가며,
       ㅇ은 한 번에 돌려 써서 끝이 시작을 지나 겹치고, ㅁ은 세 번에 끊어 써서 모서리가 조금씩 삐져나온다. */
    if (window.FontKku) {
      FontKku.registerJamo("pencil-quick", {
        "ㄱ": { box: [10, 15, 89, 92], shapes: [
          "M10 22 C30 20 60 18 84 15 Q90 14 89 21 C87 46 80 70 66 92"
        ] },
        "ㄴ": { box: [11, 10, 90, 87], shapes: [
          "M17 10 C15 35 12 60 11 78 Q10 88 20 87 C45 86 70 83 90 79"
        ] },
        "ㅁ": { box: [11, 10, 89, 88], shapes: [
          "M16 18 C15 45 13 70 11 88",
          "M15 16 C40 14 65 12 86 10 Q90 10 89 16 C88 45 86 68 83 86",
          "M11 88 C35 88 60 86 87 83"
        ] },
        "ㅅ": { box: [10, 8, 92, 90], shapes: [
          "M56 8 C52 40 36 70 10 90",
          "M46 46 C58 64 74 80 92 88"
        ] },
        "ㅇ": { box: [11.5, 11.5, 87, 87], shapes: [
          "M58 12 C28 8 8 34 12 60 C16 86 50 94 74 80 C94 66 90 30 70 16 C62 11 52 10 44 14"
        ] },
        /* 점: 왼쪽 아래 → 오른쪽 위로 톡 친 짧은 획. 가로 점(ㅏ)이면 오른쪽이 올라간 짧은 가로획,
           세로 점(ㅗ)이면 위가 오른쪽으로 기운 짧은 세로획이 되도록 칸을 거의 정사각으로 둔다. */
        "ㆍ": { box: [38, 40, 62, 60], shapes: [
          "M38 60 C46 54 54 47 62 40"
        ] },
        "ㅡ": { box: [8, 45, 92, 53], shapes: [
          "M8 53 C30 51 62 48 92 45"
        ] },
        "ㅣ": { box: [46, 6, 54, 94], shapes: [
          "M54 6 C52 36 49 66 46 94"
        ] }
      }, { frame: "box", cap: "round", join: "round" });
    }
  </script>

  <style>
    /* 요소 이름만 쓴 선택자(span 등)와 전체 선택자(*)는 쓰지 않는다 — 런타임이 만든 자소 노드까지 건드린다. */
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.7;
      color: #3a332b;
      background:
        radial-gradient(circle at 18% 8%, rgb(255 255 255 / 0.55), transparent 42%),
        radial-gradient(circle at 85% 90%, rgb(255 236 200 / 0.6), transparent 45%),
        #e8dccb;
    }

    .page {
      padding: 40px 14px 56px;
    }

    /* 쪽지 한 장 — 줄 공책 종이에 마스킹 테이프 */
    .note {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 22px 30px;
      background-color: #fffdf5;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0 33px,
        rgb(110 140 190 / 0.16) 33px 34px
      );
      background-position: 0 18px;
      border-radius: 6px;
      box-shadow:
        0 1px 2px rgb(60 40 20 / 0.12),
        0 16px 32px -14px rgb(60 40 20 / 0.38);
    }
    .note::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 112px;
      height: 28px;
      margin-left: -56px;
      background: rgb(255 214 120 / 0.72);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
      transform: rotate(-3deg);
    }

    /* 넓은 화면에서만 쪽지를 살짝 돌려 놓는다(정지된 기울기 — 움직임이 아니다).
       좁은 화면에서는 돌리지 않아 가로로 삐져나올 틈을 없앤다. */
    @media (min-width: 640px) {
      .page { padding-top: 72px; }
      .note {
        padding: 52px 48px 40px;
        transform: rotate(-0.8deg);
      }
    }

    .eyebrow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .eyebrow {
      margin: 0;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      color: #8a7a66;
    }
    .doodle {
      flex: none;
      width: 52px;
      height: 52px;
      color: #4a4f58;
    }

    /* 제목 — 연필 흘림 그림 세트. 크기는 data-size로만 주고 font-size·line-height는 주지 않는다. */
    .title {
      margin: 0 0 18px;
      color: rgb(44 48 56 / 0.9);          /* 흑연 색 — 그림 세트의 획 색은 글자 색 */
      --fy-element-width: 0.07em;          /* 연필이라 기본(0.1em)보다 가늘게 */
      --fy-selection: rgb(255 200 90 / 0.45);
    }
    /* 연필로 한 번 더 덧그은 듯한 옅은 그림자 — 원소 획·그림 세트에는 text-shadow 대신 glyph의 drop-shadow */
    .title [part="glyph"] {
      filter: drop-shadow(0.014em 0.022em 0 rgb(44 48 56 / 0.2));
    }

    .lead {
      margin: 0 0 22px;
      font-size: 1.05rem;
    }

    .details {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 6px 16px;
      margin: 0 0 28px;
    }
    .details dt {
      font-weight: 700;
      color: #7a5c3e;
    }
    .details dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* 짧은 강조 — gothic + 스티커 꾸밈. 스티커는 색 바탕 위에 둔다. */
    .hint {
      box-sizing: border-box;
      width: fit-content;
      max-width: 100%;
      margin: 0 0 10px;
      padding: 12px 20px 14px;
      background: #2a9d8f;
      border-radius: 18px;
      transform: rotate(-1.5deg);
    }
    .hint-text {
      --fy-selection: rgb(255 255 255 / 0.35);
    }
    .hint-text :is([part~="choseong"], [part~="head"]) { color: #ffd166; }
    .hint-text [part~="jungseong"] { color: #ffc2cf; }
    .hint-text [part~="jongseong"] { color: #c7e6ff; }

    .hint-note {
      margin: 0;
      font-size: 0.95rem;
      color: #5b5146;
    }

    .sign {
      margin: 28px 0 0;
      text-align: right;
      color: #5b5146;
    }

    /* 움직임: 이 페이지 CSS에는 애니메이션·전환이 없다.
       제목의 data-animate="stagger"는 폰꾸 런타임이 '동작 줄이기' 설정에서 저절로 끈다. */
  </style>
</head>
<body>
  <main class="page">
    <article class="note">
      <div class="eyebrow-row">
        <p class="eyebrow">집들이 초대장</p>
        <svg class="doodle" viewBox="0 0 52 52" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 25 C12 20 19 14 26 9 C33 14 39 19 46 24" />
            <path d="M12 21 C12 30 11 38 11 45 C22 46 33 45 42 44 C42 36 41 28 41 20" />
            <path d="M22 45 C22 39 22 35 23 32 C26 31 29 31 31 32 C31 36 31 40 31 44" />
            <path d="M34 15 C34 12 34 10 34 8 C36 8 38 8 39 8 C39 12 39 16 39 19" />
            <path d="M38 5 C40 3 42 4 44 2" opacity="0.6" />
          </g>
        </svg>
      </div>

      <!-- 제목: 연필 흘림 세트(jamo-set) · 세벌식 · 볼 때마다 새 씨앗(seed=auto) · 자모마다 씨앗(jamo-seeds)
           씨앗은 변주 클래스가 있어야 모양에 드러난다 — 기울기·들썩임·농담. 태그 안 줄바꿈은 그대로 줄바꿈이 된다. -->
      <h1 class="font-kku title kku-vary-tilt kku-vary-bob kku-vary-ink" data-jamo-set="pencil-quick" data-size="clamp(44px, 13vw, 84px)" data-seed="auto" data-jamo-seeds data-animate="stagger">새집에
놀러 와요</h1>

      <p class="lead">드디어 이사를 마쳤어요! 아직 풀지 못한 상자가 몇 개 남았지만, 햇볕 잘 드는 거실에 따뜻한 밥상을 차려 둘게요. 편하게 놀러 와요.</p>

      <dl class="details">
        <dt>언제</dt>
        <dd>11월 7일 토요일 저녁 6시부터</dd>
        <dt>어디</dt>
        <dd>망원동 햇살빌라 302호 (정확한 주소는 문자로 보내 줄게요)</dd>
        <dt>오는 길</dt>
        <dd>망원역 2번 출구에서 걸어서 8분</dd>
        <dt>답장</dt>
        <dd>11월 4일 수요일까지 올 수 있는지 알려 주세요</dd>
      </dl>

      <p class="hint"><font-kku class="hint-text kku-look-sticker" font="gothic" size="clamp(22px, 6.4vw, 32px)">빈손으로 와도 돼요</font-kku></p>
      <p class="hint-note">그래도 뭔가 들고 오고 싶다면 마실 것 한 병이면 충분해요. 휴지랑 세제는 이미 넘치게 있어요.</p>

      <p class="sign">새집에서, 지은 드림</p>
    </article>
  </main>
</body>
</html>
